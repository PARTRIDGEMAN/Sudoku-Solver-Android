name: Verify approved Sudoku screenshot fixtures

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-sudoku-fixtures.yml
      - app/src/test/resources/sudoku/fixtures/**

permissions:
  contents: read

jobs:
  verify-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify the retained human-approved inventory
        shell: bash
        run: |
          set -euo pipefail
          ROOT="app/src/test/resources/sudoku/fixtures/approved"
          URLS="app/src/test/resources/sudoku/fixtures/APPROVED_URLS.txt"
          count="$(find "$ROOT" -maxdepth 1 -type f -name '*.jpg' | wc -l | tr -d ' ')"
          [[ "$count" == "2" ]] || { echo "expected 2 approved screenshots, found $count"; exit 1; }
          (cd "$ROOT" && sha256sum --check SHA256SUMS.txt)
          python3 - <<'PY'
          from pathlib import Path
          root = Path("app/src/test/resources/sudoku/fixtures")
          urls = {line.split()[0] for line in (root / "APPROVED_URLS.txt").read_text(encoding="utf-8-sig").splitlines() if line.strip()}
          actual = {p.name for p in (root / "approved").glob("*.jpg")}
          hashes = {line.split()[1].removeprefix("./") for line in (root / "approved/SHA256SUMS.txt").read_text().splitlines() if line.strip()}
          geometry = {line.split(",")[0] for line in (root / "approved/geometry.csv").read_text().splitlines() if line.strip() and not line.startswith("#")}
          assert urls == hashes == geometry == actual, (urls, hashes, geometry, actual)
          PY
